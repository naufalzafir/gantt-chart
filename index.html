<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gantt Chart</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Gantt Chart</h1>
        <p>Project Management System</p>
    </header>

    <main>

        <!-- TASK FORM -->
        <section class="panel">

            <h2>Add Task</h2>

            <form id="taskForm">

                <div class="form-grid">

                    <div>
                        <label for="title">Title</label>
                        <input
                            type="text"
                            id="title"
                            required
                        >
                    </div>

                    <div>
                        <label for="group">Group</label>
                        <input
                            type="text"
                            id="group"
                            required
                        >
                    </div>

                    <div>
                        <label for="item">Item</label>
                        <input
                            type="text"
                            id="item"
                            required
                        >
                    </div>

                    <div>
                        <label for="subitem">Subitem</label>
                        <input
                            type="text"
                            id="subitem"
                        >
                    </div>

                    <div>
                        <label for="person">Person Involved</label>
                        <input
                            type="text"
                            id="person"
                            required
                        >
                    </div>

                    <div>
                        <label for="startDate">Start Date</label>
                        <input
                            type="date"
                            id="startDate"
                            required
                        >
                    </div>

                    <div>
                        <label for="endDate">End Date</label>
                        <input
                            type="date"
                            id="endDate"
                            required
                        >
                    </div>

                </div>

                <div class="form-actions">

                    <button
                        type="submit"
                        id="submitButton"
                    >
                        Add Task
                    </button>

                    <button
                        type="button"
                        id="cancelEditButton"
                        class="secondary"
                        hidden
                    >
                        Cancel
                    </button>

                </div>

            </form>

        </section>


        <!-- TASK LIST -->
        <section class="panel">

            <div class="section-header">

                <h2>Tasks</h2>

                <div class="data-actions">

                    <span id="taskCount">
                        0 tasks
                    </span>

                    <button
                        type="button"
                        onclick="exportCSV()"
                    >
                        Export CSV
                    </button>

                    <button
                        type="button"
                        class="secondary"
                        onclick="saveAsCSV()"
                    >
                        Save as CSV
                    </button>

                </div>

            </div>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>
                            <th>Title</th>
                            <th>Group</th>
                            <th>Item</th>
                            <th>Subitem</th>
                            <th>Person</th>
                            <th>Start</th>
                            <th>End</th>
                            <th>Actions</th>
                        </tr>

                    </thead>

                    <tbody id="taskTableBody"></tbody>

                </table>

            </div>

        </section>


        <!-- GANTT -->
        <section class="panel gantt-panel">

            <div class="section-header">

                <h2>Gantt Chart</h2>

            </div>

            <div
                id="ganttContainer"
                class="gantt-container"
            ></div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
